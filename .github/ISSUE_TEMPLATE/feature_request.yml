name: Feature request / 功能建议
description: Suggest a QuickOps improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case / 问题或场景
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution / 建议方案
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Permission and safety impact / 权限与安全影响
