name: Bug report / 缺陷报告
description: Report a reproducible QuickOps problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove credentials, host identifiers, customer data, and sensitive logs before submitting.
  - type: input
    id: version
    attributes:
      label: Version / 版本
      placeholder: v0.0.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform / 平台
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened? / 问题描述
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps / 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true
